name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
      - name: Formatting & linting (ruff, cargo fmt, markdownlint, actionlint)
        run: pixi run lint

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
      - name: cargo test
        run: pixi run -- cargo test
      - name: cargo clippy
        run: pixi run -- cargo clippy --all-targets --all-features -- -Dwarnings

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [py310-numpy-oldest, py314-numpy-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          environments: ${{ matrix.env }}
          cache: true
      - name: build
        run: pixi run -e ${{ matrix.env }} build
      - name: pytest
        run: pixi run -e ${{ matrix.env }} -- pytest
      - name: mypy
        run: pixi run -e ${{ matrix.env }} -- mypy python/pynw
