name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          cache: true
      - name: Formatting & linting (ruff, cargo fmt, markdownlint, actionlint)
        run: pixi run lint

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          cache: true
      - name: cargo test
        run: pixi run -- cargo test
      - name: cargo clippy
        run: pixi run -- cargo clippy --all-targets --all-features -- -Dwarnings

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [py310-numpy-oldest, py314-numpy-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          environments: ${{ matrix.env }}
          cache: true
      - name: build
        run: pixi run -e ${{ matrix.env }} build
      - name: pytest
        run: pixi run -e ${{ matrix.env }} -- pytest
      - name: mypy
        run: pixi run -e ${{ matrix.env }} -- mypy python/pynw
